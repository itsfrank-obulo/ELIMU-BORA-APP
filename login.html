<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Elimu Fund</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./index.css">
  </head>
  <body class="min-h-screen bg-stone-50 text-slate-900">
    <header class="border-b border-slate-200/80 bg-white">
      <div class="mx-auto flex h-18 max-w-7xl items-center justify-between px-5 sm:px-8">
        <a href="./Index.html" class="flex items-center gap-3 text-slate-900 no-underline">
          <span class="logo-box">EF</span>
          <span><strong class="block font-extrabold">Elimu Fund</strong><small class="brand-label">NG-CDF Bursary Portal</small></span>
        </a>
        <a href="./contacts.html" class="help-button">Need help?</a>
      </div>
    </header>
    <main class="mx-auto max-w-xl px-5 py-16 sm:px-8">
      <section class="panel p-6 sm:p-9">
        <p class="eyebrow">Welcome back</p>
        <h1 class="mt-2 text-3xl font-extrabold tracking-tight">Sign in to your account</h1>
        <p class="mt-3 text-sm leading-6 text-slate-500">Use the Kenyan phone number or email address linked to your account.</p>
        <form id="login-form" class="mt-8 space-y-5">
          <label class="field-label"><span>Phone number or email</span><input class="field" name="identifier" autocomplete="username" required></label>
          <label class="field-label"><span>Password</span><input class="field" name="password" type="password" autocomplete="current-password" required></label>
          <p id="login-error" class="form-error hidden" role="alert"></p>
          <button id="login-submit" class="primary-button w-full" type="submit">Sign in</button>
        </form>
        <p class="mt-7 text-center text-sm text-slate-500">New to Elimu Fund? <a class="font-bold text-emerald-700" href="./Index.html">Create an account</a></p>
      </section>
    </main>
    <script type="module" src="./login.js"></script>
  </body>
</html>
