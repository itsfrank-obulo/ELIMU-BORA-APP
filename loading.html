<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preparing your account · Elimu Fund</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./index.css">
  </head>
  <body>
    <main class="status-page">
      <section class="status-card" aria-live="polite">
        <div class="status-brand logo-box"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M12 3 5 6v5c0 4.5 2.7 8 7 10 4.3-2 7-5.5 7-10V6l-7-3Z"/></svg></div>
        <div class="loader-rings"><span></span><span></span><svg class="h-8 w-8 text-emerald-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M12 3 5 6v5c0 4.5 2.7 8 7 10 4.3-2 7-5.5 7-10V6l-7-3Z"/></svg></div>
        <p class="status-eyebrow">Account created</p>
        <h1 class="status-title">Setting up your dashboard</h1>
        <p class="status-copy">Please wait a moment while we securely prepare your bursary profile.</p>
        <div class="loading-track"><span></span></div>
        <p class="mt-5 text-xs font-semibold text-slate-400">Redirecting automatically…</p>
      </section>
    </main>
    <script>setTimeout(() => window.location.replace("./dashboard.html"), 1400);</script>
  </body>
</html>
