<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You’re offline · Elimu Fund</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./index.css">
  </head>
  <body>
    <main class="status-page">
      <section class="status-card">
        <div class="offline-icon"><svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="m3 3 18 18M8.5 8.5A7 7 0 0 1 19 10M5 10a10 10 0 0 1 1.2-1.2M8.5 14.5a5 5 0 0 1 7 0M12 19h.01"/></svg></div>
        <p class="status-eyebrow">Connection interrupted</p>
        <h1 class="status-title">You’re currently offline</h1>
        <p class="status-copy">Check your mobile data or Wi-Fi connection, then try again. Your entered details are safe on this device.</p>
        <button id="retry" class="status-button mt-8">Try again</button>
        <p id="still-offline" class="mt-4 hidden text-xs font-semibold text-red-600">Still offline. Please check your connection.</p>
      </section>
    </main>
    <script>
      document.querySelector("#retry").addEventListener("click", () => {
        if (navigator.onLine) window.location.replace("./Index.html");
        else document.querySelector("#still-offline").classList.remove("hidden");
      });
      window.addEventListener("online", () => window.location.replace("./Index.html"));
    </script>
  </body>
</html>
